name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  schedule:
    # Måndagar 06:00 svensk tid: 04:00 UTC sommartid, 05:00 UTC vintertid.
    # Båda körs, jobbet tidskontroll släpper bara igenom den som är kl. 06 i Stockholm.
    - cron: "0 4 * * 1"
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tidskontroll:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.kolla.outputs.kor }}
    steps:
      - id: kolla
        run: |
          timme=$(TZ=Europe/Stockholm date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$timme" = "06" ]; then
            echo "kor=true" >> "$GITHUB_OUTPUT"
          else
            echo "Schemalagd körning kl. $timme svensk tid, hoppar över."
            echo "kor=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: tidskontroll
    if: needs.tidskontroll.outputs.kor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e . pytest

      - run: pytest

  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # samma version som servern
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skriv mätvärden i Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("outputs/matvarden.json"))
          print("## Mätvärden")
          print()
          print("| Mått | Värde |")
          print("|---|---|")
          for k, v in m.items():
              print(f"| {k} | {v} |")
          EOF

      - run: python -m churn.evaluate

  ringlista:
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.score

      - uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error