name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e . pytest

      - run: pytest

  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # samma version som servern
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skriv mätvärden i Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("outputs/matvarden.json"))
          print("## Mätvärden")
          print()
          print("| Mått | Värde |")
          print("|---|---|")
          for k, v in m.items():
              print(f"| {k} | {v} |")
          EOF

      - run: python -m churn.evaluate